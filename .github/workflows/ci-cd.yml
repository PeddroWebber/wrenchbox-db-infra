name: CI/CD

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:

jobs:
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: Terraform plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} -backend-config=container_name=tfstate -backend-config=key=wrenchbox-db.tfstate
      - run: terraform plan -input=false

  apply:
    name: Terraform apply
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          terraform init -input=false -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} -backend-config=container_name=tfstate -backend-config=key=wrenchbox-db.tfstate
          terraform apply -input=false -auto-approve -var "operator_ip=${IP}"
      - name: Create database roles
        run: |
          VAULT=$(terraform output -raw key_vault_name)
          export PGHOST=$(terraform output -raw postgres_fqdn)
          export PGPASSWORD=$(az keyvault secret show --vault-name "$VAULT" --name postgres-admin-password --query value -o tsv)
          export APP_PASSWORD=$(az keyvault secret show --vault-name "$VAULT" --name customers-app-connection-homolog --query value -o tsv | sed -n 's/.*Password=\([^;]*\).*/\1/p')
          export AUTH_PASSWORD=$(az keyvault secret show --vault-name "$VAULT" --name customers-auth-connection-homolog --query value -o tsv | sed -n 's/.*Password=\([^;]*\).*/\1/p')
          bash scripts/create-roles.sh
